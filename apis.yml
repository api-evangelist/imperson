aid: imperson
name: Imperson
description: >-
  Imperson is an enterprise conversational-AI company and creative studio that
  builds turnkey, premium chatbots to automate the customer journey through
  natural, two-way dialogue. Its platform spans lead generation, customer
  support, sales and e-commerce, and engagement/entertainment, with a
  conversation engine, dashboard analytics, and a knowledgebase, activating
  across channels including Facebook Messenger, Amazon Alexa, websites, SMS,
  Google Assistant, native apps, and phone. Imperson operates an
  enterprise-sales model (no public self-serve developer API is published) and
  has produced chatbot experiences for brands such as Disney, Microsoft,
  Amazon, National Geographic, and Universal. The company was surfaced as a
  Techstars portfolio company and profiled into the API Evangelist network.
