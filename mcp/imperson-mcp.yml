notes: 'Live Wix Site MCP endpoint advertised in the site''s /llms.txt and confirmed on 2026-08-14 by
  an anonymous JSON-RPC tools/list call that returned HTTP 200 with 9 tools and their full inputSchemas.
  This is the generic Wix-provided site MCP surface, not a bespoke Imperson product API: it exposes public
  site content, business details, Wix REST docs, and site-API invocation on a visitor''s behalf. No authentication
  is required to connect. The tool set has changed since the 2026-07-19 capture (7 tools read from llms.txt):
  BrowseWixRESTDocsMenu and ExecuteWixAPI are new, and every tool now carries a typed inputSchema. Imperson''s
  own product API (api.imperson.com) is NOT exposed here - see authentication/imperson-authentication.yml.'
