- name: SearchSiteApiDocs
  description: 'Searches for site "Imperson" (https://www.imperson.com/_api/mcp) API documentation and
    returns how to use the site using the API.

    You are a helpful "Imperson" site assistant chatbot and you are helping the user perform actions on
    the site - to query the site''s data or to perform an action on the site.

    Specify the API endpoint, resource, or action you need information about (e.g., ''get site details
    endpoint'', ''create data collection'', ''update product API'', ''REST authentication'').

    If you can''t find what you need, try to rephrase your search term.

    The search term MUST be a short natural-language phrase describing an API capability. Do NOT pass
    code, SQL, shell commands, HTML/script, URLs, file paths, or special symbols — such inputs are rejected
    as invalid and return no results.'
  parameters:
  - name: searchTerm
    type: string
    required: true
- name: GetBusinessDetails
  description: 'Get business and site details for "Imperson" (https://www.imperson.com/_api/mcp).

    This tool will return business details: timezone, email, phone, fax, address, site name, business
    name, description, business schedule, special hour period.

    It will also return site features that you can use via other tools (bookings, store, etc.).

    Call this tool when user asks for business contact details, or about what they can do on the site,
    or when you need to know what features are available on the site.'
  parameters: []
- name: SearchInSite
  description: 'Searches the site "Imperson" (https://www.imperson.com/_api/mcp) for information.

    Use this tool ONLY in the following cases:

    1. You just used "GetBusinessDetails" tool and you did not find the information you need.

    2. User asked a generic business question about their business (e.g., business address, business hours,
    contact information, return policy, etc.)

    3. You already tried to find an entity (e.g., product, service, etc.) using an API tool and you did
    not find the information you need.

    4. The request is too vague and you do not know what type of entity it is and what to search for in
    the docs.

    Do NOT use this tool for searching for products or other offered services - use the ''SearchSiteApiDocs''
    tool instead (unless you already tried that tool and you did not find the information you need).

    This tool DOES NOT support filters - you cannot ask questions like "find me something under $10".'
  parameters:
  - name: searchTerm
    type: string
    required: true
- name: ExecuteWixAPI
  description: "Run JavaScript against the Wix REST API on site \"Imperson\" (https://www.imperson.com/_api/mcp),\
    \ on the visitor's behalf. The code runs in a sandbox and you get back whatever it returns.\n\nPREFER\
    \ THIS TOOL OVER CallWixSiteAPI. CallWixSiteAPI makes a single HTTP request; ExecuteWixAPI runs real\
    \ code, so you can chain calls, paginate, filter, and shape the result in one step. Use ExecuteWixAPI\
    \ for any Wix API work on this site, and fall back to CallWixSiteAPI only for a trivial one-shot read\
    \ where code adds nothing.\n\nDO A WHOLE RECIPE IN ONE CALL. When a task needs several requests —\
    \ e.g. query to resolve an id, then mutate; create then confirm; read a list then act on a match —\
    \ write ONE ExecuteWixAPI call whose code performs every step in sequence and returns the final result.\
    \ Do NOT split a multi-request recipe into multiple separate tool calls; that wastes round-trips and\
    \ loses intermediate state. If a recipe from the docs lists steps 1..N, the code should run steps\
    \ 1..N.\n\nCRITICAL CODE SHAPE:\n- The `code` parameter MUST be the function expression itself: `async\
    \ function() { ... }` or `async () => { ... }`.\n- Do NOT send a script body like `const result =\
    \ await ...; return result;`.\n- Do NOT call the function yourself. The tool calls it for you.\n-\
    \ Put all `const`, `await`, and `return` statements inside the function body.\n\nDo not rely on memory\
    \ for Wix API endpoints, methods, schemas, or request bodies. Before writing code, use SearchSiteApiDocs\
    \ (and ReadFullDocsArticle / ReadFullDocsMethodSchema) to confirm the exact API URL, HTTP method,\
    \ request body structure, field names, required fields, and enum values. The URL usually starts with\
    \ `https://www.wixapis.com`. Before reading fields off a response, know its exact shape — don't guess\
    \ paths like `result.id` when it may be `result.results[0].item.id`. Pass every docs/recipe URL you\
    \ relied on in the `sourceDocUrls` parameter.\n\nAuthentication: pass the `visitorToken` parameter\
    \ (from GenerateVisitorToken; reuse the one already in your context, do not create a new one each\
    \ call). Everything runs against this visitor site automatically — do NOT set `scope`, `siteId`, Authorization,\
    \ wix-site-id, or wix-account-id.\n\nFile and export limits: ExecuteWixAPI is only for Wix REST API\
    \ calls and in-memory data shaping. It does not provide Node.js built-in modules or filesystem access,\
    \ and it cannot create downloadable files. Do not import `fs`, `path`, or `node:*`, write files, or\
    \ promise a generated downloadable file from inside this tool. For large exports, return compact summaries\
    \ or the specific fields needed for the answer; if the user needs a full downloadable CSV/JSON file,\
    \ direct them to the product's native export flow or ask for a smaller filtered export.\n\nProbing\
    \ should be read-only: use GET/query/list/search to inspect state, resolve real ids, or verify a previous\
    \ write. For create/update/delete, read the docs first and call the mutation only with real resolved\
    \ inputs — no speculative mutations just to learn the response shape.\n\nError handling: `wix.request()`\
    \ throws when the Wix API returns an error. For dependent steps, let it throw so the failure is reported\
    \ clearly. For independent read-only probes you may wrap each in `try/catch` and return partial results;\
    \ when running them in parallel use `Promise.allSettled` (not `Promise.all`) so one failure doesn't\
    \ discard the rest.\n\nAvailable in your code:\n```typescript\ninterface WixRequestOptions {\n  method:\
    \ \"GET\" | \"POST\" | \"PUT\" | \"PATCH\" | \"DELETE\";\n  url: string;           // Full Wix API\
    \ URL, e.g. \"https://www.wixapis.com/stores-reader/v1/products/query\"; paths starting with \"/\"\
    \ resolve against https://www.wixapis.com\n  body?: unknown;\n}\n\ninterface WixResponse<T = unknown>\
    \ {\n  status: number;\n  data: T;\n  json(): Promise<T>; // Fetch-compatible alias for data\n}\n\n\
    declare const wix: {\n  request<T = unknown>(options: WixRequestOptions): Promise<WixResponse<T>>;\n\
    };\n```\n\nReturn compact, task-focused data instead of raw API responses. For list/query/search endpoints,\
    \ paginate in code and map each item to just the fields the task needs. When the code CREATES entities\
    \ (create, bulk create, import, duplicate, upload), ALWAYS include the ID of every created entity\
    \ in the returned object — e.g. `{ cartId }` or `{ createdIds: [...] }` — even if the user did not\
    \ ask for them; follow-up steps, verification, and cleanup all need those IDs, and recovering them\
    \ later costs extra query calls.\n\nExample — a multi-step recipe (resolve a product by name, then\
    \ add it to the cart) done in ONE call:\n```javascript\nasync function() {\n  // Step 1: find the\
    \ product\n  const found = await wix.request({\n    method: \"POST\",\n    url: \"https://www.wixapis.com/stores-reader/v1/products/query\"\
    ,\n    body: { query: { filter: JSON.stringify({ name: \"Florie Eau de Parfum\" }) } }\n  });\n  const\
    \ product = found.data.products?.[0];\n  if (!product) return { error: \"PRODUCT_NOT_FOUND\" };\n\n\
    \  // Step 2: create a cart with that product\n  const cart = await wix.request({\n    method: \"\
    POST\",\n    url: \"https://www.wixapis.com/ecom/v1/carts/create-cart\",\n    body: { cart: { lineItems:\
    \ [{ catalogReference: {\n      appId: \"215238eb-22a5-4c36-9e7b-e7c08025e04e\",\n      catalogItemId:\
    \ product.id\n    }, quantity: 1 }] } }\n  });\n\n  return { cartId: cart.data.cart?.id, productId:\
    \ product.id, name: product.name };\n}\n```"
