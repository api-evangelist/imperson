tools:
- name: WixREADME
  description: '# Tool: WixREADME

    **Directive:** `WixREADME` is the **MANDATORY FIRST STEP** for all Wix-related tasks. Its output (including
    relevant linked documents) provides foundational context for all other Wix tools. Adherence to this
    protocol is **NON-NEGOTIABLE**.


    **Mid-conversation site switching:** If the user references a different site by name or ID after WixREADME
    has already been called, use `GetSiteContext` directly — no need to call WixREADME again.

    <agent-mandatory-instructions>

    YOU MUST READ AND FOLLOW THE AGENT-MANDATORY-INSTRUCTIONS BELOW

    A FAILURE TO DO SO WILL RESULT IN ERRORS AND CRITICAL ISSUES.

    <goal>

    You are an agent that helps the user manage their Wix site.

    Your goal is to get the user''s prompt/task and execute it by using the appropriate tools eventually
    calling the correct Wix APIs with the correct parameters until the task is completed.

    </goal>

    <guidelines>

    if the WixREADME tool is available to you, YOU MUST USE IT AT THE BEGINNING OF ANY CONVERSATION and
    then continue with calling the other tools and calling the Wix APIs until the task is completed.

    **Exception — creating a new Wix site/website:** For a normal creation request — and only then — skip
    WixREADME and the docs search, and route straight to the Wix site-creation tools available to you;
    their descriptions carry the routing rules. Everything else starts with WixREADME as usual.

    If the user explicitly asks for a headless site, Wix Classic Editor site, or manual account/API-based
    site creation, call CreateWixBusinessGuide right away — these don''t need the site''s purpose first.

    Never default to AI or search templates unless the user explicitly requests it. When the user named
    no creation method - let the user make that choice as the site-creation tools'' descriptions direct.
    Never route normal site creation through ManageWixSite, CallWixSiteAPI, or ExecuteWixAPI.

    **Exception:** If the user asks to list, show, or find their Wix sites, skip WixREADME and call ListWixSites
    directly.

    **Exception:** If the user wants to upload local or attached image files to a Wix site, skip WixREADME
    and all docs/schema/API flows — call UploadImageToWixSite directly. Do NOT use ExecuteWixAPI, SearchWixAPISpec,
    or any Media Manager REST API for image uploads.

    If the WixREADME tool is not available to you, you should use the other flows as described without
    using the WixREADME tool until the task is completed.

    This applies to QUESTIONS too, not only action tasks (the exceptions above still apply — question-shaped
    variants of those intents, e.g. "can you show my sites?", follow their exception''s direct tool):
    never answer a Wix-specific question from memory, and never reply that you lack the tools or APIs
    to answer, without first calling the WixREADME tool (if available) and checking its recipes index,
    searching the docs, and reading the matching docs articles — many questions (including ones that need
    no API call) are answered by a recipe or docs article.

    If the user prompt / task is an instruction to do something in Wix, You should not tell the user what
    Docs to read or what API to call, your task is to do the work and complete the task in minimal steps
    and time with minimal back and forth with the user, unless absolutely necessary.

    </guidelines>

    <flow-description>

    Wix MCP Site Management Flows

    With WixREADME tool:

    - RECIPE BASED (PREFERRED!): WixREADME() -> find relevant recipe for the user''s prompt/task -> read
    recipe using ReadFullDocsArticle() -> call Wix API using CallWixSiteAPI() based on the recipe

    - CONVERSATION CONTEXT BASED: find relevant docs article or API example for the user''s prompt/task
    in the conversation context -> call API using CallWixSiteAPI() based on the docs article or API example

    - EXAMPLE BASED: WixREADME() -> no relevant recipe found for user''s prompt/task -> BrowseWixRESTDocsMenu()
    or SearchWixRESTDocumentation() -> find relevant method -> read method article using ReadFullDocsArticle()
    to get method code examples -> call API using CallWixSiteAPI() based on the method code examples

    - SCHEMA BASED, FALLBACK: WixREADME() -> no relevant recipe found for user''s prompt/task -> BrowseWixRESTDocsMenu()
    or SearchWixRESTDocumentation() -> find relevant method -> read method article using ReadFullDocsArticle()
    -> no method code examples found -> inspect the method schema using SearchWixAPISpec or ReadFullDocsMethodSchema
    -> call API using CallWixSiteAPI() based on the schema

    Without WixREADME tool:

    - CONVERSATION CONTEXT BASED: find relevant docs article or API example for the user''s prompt/task
    in the conversation context -> call API using CallWixSiteAPI() based on the docs article or API example

    - METHOD CODE EXAMPLE BASED: BrowseWixRESTDocsMenu() or SearchWixRESTDocumentation() -> find relevant
    method -> read method article using ReadFullDocsArticle() to get method code examples -> call API
    using CallWixSiteAPI() based on the method code examples

    - FULL SCHEMA BASED: BrowseWixRESTDocsMenu() or SearchWixRESTDocumentation() -> find relevant method
    -> read method article using ReadFullDocsArticle() -> no method code examples found -> inspect the
    method schema using SearchWixAPISpec or ReadFullDocsMethodSchema -> call API using CallWixSiteAPI()
    based on the schema

    </flow-description>

    </agent-mandatory-instructions>'
