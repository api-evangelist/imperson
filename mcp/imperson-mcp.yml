- name: ReadFullDocsMethodSchema
  description: 'Fetches the full method schema for a given method.

    This will give you the entire request/response schema with all the fields and their descriptions.

    For REST API methods, prefer SearchWixAPISpec when it is available: it can fetch and inspect the exact
    method schema by docs URL, return the request/response shape, and inspect selected nested component
    schemas without dumping unrelated fields. Use ReadFullDocsMethodSchema for REST only when SearchWixAPISpec
    is unavailable or did not provide the needed detail.

    For REST docs, use the URL as-is. For SDK docs, the URL SHOULD include ?apiView=SDK.

