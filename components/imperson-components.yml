notes: >-
  Imperson serves one publicly-fetchable, embeddable client-side component: the Toolbox chat widget
  loader. It is distributed from chat.imperson.com as a plain script + stylesheet pair with no package
  registry behind it, so there is no version to read — the URL is unpinned and floats to whatever the
  host currently serves. Consumers cannot tell what build they are getting. The loader was fetched and
  read in full on 2026-08-14; everything recorded below comes from that file, not from documentation
  (Imperson publishes no embed reference).
